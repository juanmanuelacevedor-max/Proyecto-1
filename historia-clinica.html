<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historia clínica</title>
  <style>
    :root {
      --navy: #142b3f;
      --teal: #0f7a77;
      --teal-soft: #eaf8f7;
      --gold: #d5aa61;
      --line: #e3eaf1;
      --paper: #ffffff;
      --muted: #5d6f7d;
      --ink: #1d2c3c;
      --danger: #d85d5d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f4f8fb 0%, #eef5f7 100%);
      color: var(--ink);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .page {
      max-width: 980px;
      margin: 40px auto;
      padding: 0 20px 40px;
    }

    .panel {
      background: var(--paper);
      border: 1px solid rgba(19, 43, 63, 0.06);
      border-radius: 24px;
      box-shadow: 0 24px 54px rgba(16, 39, 54, 0.12);
      padding: 28px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: -0.7px;
      color: var(--navy);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--teal-soft);
      color: var(--teal);
      border: 1px solid rgba(15, 122, 119, 0.15);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .pet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .pet-name {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
      color: var(--navy);
    }

    .pet-meta {
      color: var(--muted);
      font-size: 14px;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      color: var(--ink);
      font-size: 13px;
    }

    textarea, input {
      width: 100%;
      margin-top: 8px;
      border: 1px solid #dfe7ee;
      border-radius: 12px;
      background: #fff;
      padding: 12px 14px;
      font: inherit;
      color: var(--ink);
      outline: none;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    input:focus, textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(15, 122, 119, 0.10);
    }

    .vaccine-section {
      margin-top: 6px;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: var(--paper-soft, #fafbfd);
    }

    .vaccine-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .vaccine-header h3 {
      margin: 0;
      font-size: 18px;
      color: var(--navy);
    }

    .button {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font: 700 12px 'Segoe UI', sans-serif;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .button:hover { transform: translateY(-1px); }

    .button-primary {
      background: linear-gradient(135deg, var(--teal) 0%, #1ea3a0 100%);
      color: white;
      box-shadow: 0 14px 24px rgba(15, 122, 119, 0.2);
    }

    .button-secondary {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--navy);
    }

    .button-danger {
      background: rgba(216, 93, 93, 0.08);
      color: var(--danger);
      border: 1px solid rgba(216, 93, 93, 0.16);
    }

    .vaccine-list {
      display: grid;
      gap: 12px;
    }

    .vaccine-item {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }

    .message {
      min-height: 20px;
      margin-top: 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--teal);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    @media (max-width: 640px) {
      .topbar, .pet-header, .vaccine-header, .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .vaccine-item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <div class="topbar">
        <h1>Historia clínica</h1>
        <span class="badge">Ficha médica</span>
      </div>

      <div class="pet-header">
        <div>
          <p class="pet-name" id="pet-name">Mascota</p>
          <div class="pet-meta" id="pet-meta">Cargando datos...</div>
        </div>
        <button class="button button-secondary" type="button" id="back-button">Volver al registro</button>
      </div>

      <div class="fields">
        <label>
          Historia clínica
          <textarea id="clinical-history" placeholder="Describe los antecedentes, tratamiento, conducta, condiciones o observaciones relevantes..."></textarea>
        </label>

        <section class="vaccine-section">
          <div class="vaccine-header">
            <h3>Vacunas</h3>
            <button class="button button-primary" type="button" id="add-vaccine">Agregar vacuna</button>
          </div>

          <div id="vaccine-list" class="vaccine-list"></div>
        </section>
      </div>

      <div class="message" id="message" aria-live="polite"></div>

      <div class="actions">
        <button class="button button-secondary" type="button" id="cancel-button">Cancelar</button>
        <button class="button button-primary" type="button" id="save-button">Guardar historia clínica</button>
      </div>
    </div>
  </div>

  <script src="historia-clinica.js"></script>
</body>
</html>
